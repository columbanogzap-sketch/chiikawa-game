<!DOCTYPE html>
<html lang="en">
<head>

  <style>
    :root {
      --bg-color: #fbebf2;
      --card-bg: #ffffff;
      --border-color: #4a332a;
      --accent-pink: #ff8fb1;
      --accent-yellow: #ffe57f;
      --accent-blue: #90caf9;
      --accent-purple: #ce93d8;
      --font-pixel: 'Press Start 2P', cursive, monospace;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      background-image: 
        radial-gradient(#ffcdd2 15%, transparent 16%),
        radial-gradient(#ffcdd2 15%, transparent 16%);
      background-size: 30px 30px;
      background-position: 0 0, 15px 15px;
      font-family: var(--font-pixel);
      color: var(--border-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      padding: 15px 10px 40px 10px;
      overflow-y: auto;
      overflow-x: hidden;
      touch-action: manipulation;
    }

    .game-wrapper {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    header {
      text-align: center;
      width: 100%;
    }

    h1 {
      font-size: 16px;
      color: #ff5252;
      text-shadow: 2px 2px 0 #ffffff, 3px 3px 0 var(--border-color);
      letter-spacing: 1px;
      margin-bottom: 2px;
      line-height: 1.3;
    }

    .arcade-box {
      width: 100%;
      background: var(--card-bg);
      border: 4px solid var(--border-color);
      border-radius: 12px;
      box-shadow: 0 8px 0 var(--border-color);
      padding: 10px;
      position: relative;
    }

    .hud {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #fff8e1;
      border: 3px solid var(--border-color);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 9px;
      margin-bottom: 8px;
    }

    .hud-val {
      color: #e65100;
      margin-left: 4px;
    }

    .canvas-container {
      position: relative;
      width: 100%;
      padding-top: 100%;
      background-color: #fffde7;
      border: 4px solid var(--border-color);
      border-radius: 8px;
      overflow: hidden;
      box-sizing: border-box;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      touch-action: none;
    }

    .powerup-toast {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%) translateY(-20px);
      background: #fff176;
      border: 3px solid var(--border-color);
      border-radius: 8px;
      padding: 6px 10px;
      text-align: center;
      box-shadow: 0 4px 0 var(--border-color);
      z-index: 20;
      opacity: 0;
      transition: all 0.25s ease-out;
      pointer-events: none;
      width: 85%;
    }

    .powerup-toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .toast-title {
      font-size: 8px;
      color: #d81b60;
      margin-bottom: 3px;
    }

    .toast-desc {
      font-size: 6px;
      color: #333;
      line-height: 1.3;
    }

    .powerup-bar {
      display: flex;
      gap: 6px;
      justify-content: center;
      min-height: 24px;
      margin-top: 8px;
      flex-wrap: wrap;
    }

    .powerup-badge {
      font-size: 8px;
      padding: 4px 8px;
      border-radius: 4px;
      border: 2px solid var(--border-color);
      background: #fff;
      display: flex;
      align-items: center;
      gap: 4px;
      box-shadow: 2px 2px 0 var(--border-color);
    }

    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(255, 253, 231, 0.98);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px 12px;
      text-align: center;
      z-index: 10;
      overflow-y: auto;
    }

    .overlay.hidden {
      display: none;
    }

    .overlay-title {
      font-size: 11px;
      color: #ff4081;
      text-shadow: 1px 1px 0 #fff, 2px 2px 0 var(--border-color);
      margin-bottom: 14px;
      line-height: 1.2;
    }

    .char-select-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
      max-width: 260px;
      margin-bottom: 16px;
    }

    .char-card {
      background: #ffffff;
      border: 3px solid var(--border-color);
      border-radius: 10px;
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 0 var(--border-color);
      transition: all 0.15s ease;
    }

    .char-card.selected {
      border-color: #ff4081;
      box-shadow: 0 5px 0 #ff4081;
      transform: scale(1.02);
    }

    .char-card.hachiware { background-color: #e3f2fd; }
    .char-card.usagi { background-color: #fffde7; }

    .char-name {
      font-size: 14px;
      font-weight: bold;
      letter-spacing: 2px;
      text-align: center;
      width: 100%;
    }

    .btn-pixel {
      font-family: var(--font-pixel);
      font-size: 9px;
      padding: 10px 14px;
      border: 3px solid var(--border-color);
      border-radius: 8px;
      background: var(--accent-yellow);
      color: var(--border-color);
      cursor: pointer;
      box-shadow: 0 4px 0 var(--border-color);
      width: 90%;
      max-width: 260px;
    }

    .btn-pixel:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 var(--border-color);
    }

    .btn-pixel.secondary {
      background: var(--accent-blue);
      margin-top: 8px;
    }

    .controls-panel {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .btn-toggle-dpad {
      font-family: var(--font-pixel);
      font-size: 7px;
      background: #fff;
      border: 2px solid var(--border-color);
      border-radius: 4px;
      padding: 5px 8px;
      cursor: pointer;
      box-shadow: 2px 2px 0 var(--border-color);
    }

    .dpad-container {
      display: grid;
      grid-template-columns: repeat(3, 38px);
      grid-template-rows: repeat(3, 38px);
      gap: 4px;
      margin-top: 2px;
    }

    .dpad-container.hidden {
      display: none;
    }

    .dpad-btn {
      background: #ffffff;
      border: 3px solid var(--border-color);
      border-radius: 6px;
      box-shadow: 0 3px 0 var(--border-color);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      cursor: pointer;
    }

    .dpad-btn:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 var(--border-color);
      background: #ffe082;
    }

    .dpad-up { grid-column: 2; grid-row: 1; }
    .dpad-left { grid-column: 1; grid-row: 2; }
    .dpad-right { grid-column: 3; grid-row: 2; }
    .dpad-down { grid-column: 2; grid-row: 3; }

    .controls-hint {
      font-size: 6px;
      color: #666;
      text-align: center;
      line-height: 1.3;
    }

  <div class="game-wrapper">
    <header>
      <h1>CHIIKAWA SNAKE</h1>
    </header>

    <div class="arcade-box">
      <div class="hud">
        <div>SCORE:<span id="scoreDisplay" class="hud-val">0</span></div>
        <div>HIGH:<span id="highScoreDisplay" class="hud-val">0</span></div>
      </div>

      <div class="canvas-container">
        <canvas id="gameCanvas" width="320" height="320"></canvas>

        <div id="powerupToast" class="powerup-toast">
          <div id="toastTitle" class="toast-title">DIAMOND POWER-UP!</div>
          <div id="toastDesc" class="toast-desc">Power-up activated!</div>
        </div>

        <div id="selectOverlay" class="overlay">
          <div class="overlay-title">SELECT YOUR PAL</div>

          <div class="char-select-grid">
            <div id="cardChiikawa" class="char-card chiikawa selected" onclick="highlightCharacter('chiikawa')">
              <div class="char-name" style="color:#d81b60;">CHIIKAWA</div>
            </div>

            <div id="cardHachiware" class="char-card hachiware" onclick="highlightCharacter('hachiware')">
              <div class="char-name" style="color:#1e88e5;">HACHIWARE</div>
            </div>

            <div id="cardUsagi" class="char-card usagi" onclick="highlightCharacter('usagi')">
              <div class="char-name" style="color:#f57f17;">USAGI</div>
            </div>
          </div>

          <button class="btn-pixel" onclick="confirmAndStartGame()">START GAME</button>
        </div>

        <div id="gameOverOverlay" class="overlay hidden">
          <div class="overlay-title" style="color:#d32f2f;">GAME OVER!</div>
          <div style="font-size: 8px; margin-bottom: 12px;">FINAL SCORE: <span id="finalScore" style="color:#e65100;">0</span></div>
          <button class="btn-pixel" onclick="restartGame()">PLAY AGAIN</button>
          <button class="btn-pixel secondary" onclick="goToPlayerSelect()">CHANGE PAL</button>
        </div>
      </div>

      <div id="powerupBar" class="powerup-bar"></div>
    </div>

    <div class="controls-panel">
      <button class="btn-toggle-dpad" onclick="toggleDPad()">TOGGLE D-PAD CONTROLS</button>
      
      <div id="dpad" class="dpad-container hidden">
        <div class="dpad-btn dpad-up" onclick="setDirection('UP')">▲</div>
        <div class="dpad-btn dpad-left" onclick="setDirection('LEFT')">◄</div>
        <div class="dpad-btn dpad-right" onclick="setDirection('RIGHT')">►</div>
        <div class="dpad-btn dpad-down" onclick="setDirection('DOWN')">▼</div>
      </div>

      <div class="controls-hint">
        SWIPE ON CANVAS OR USE ARROW/WASD KEYS
      </div>
    </div>
  </div>

  <script>
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new AudioCtx();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playChompSFX() {
      if (!audioCtx) return;
      try {
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(320, now);
        osc.frequency.exponentialRampToValueAtTime(90, now + 0.08);
        
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);

        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.08);
      } catch (e) {}
    }

    function playYippeeSFX() {
      if (!audioCtx) return;
      try {
        const now = audioCtx.currentTime;
        const osc1 = audioCtx.createOscillator();
        const gain1 = audioCtx.createGain();
        osc1.type = 'triangle';
        osc1.frequency.setValueAtTime(450, now);
        osc1.frequency.exponentialRampToValueAtTime(850, now + 0.07);

        gain1.gain.setValueAtTime(0.35, now);
        gain1.gain.exponentialRampToValueAtTime(0.01, now + 0.08);

        osc1.connect(gain1);
        gain1.connect(audioCtx.destination);
        osc1.start(now);
        osc1.stop(now + 0.08);

        const osc2 = audioCtx.createOscillator();
        const gain2 = audioCtx.createGain();
        osc2.type = 'sine';
        osc2.frequency.setValueAtTime(950, now + 0.09);
        osc2.frequency.linearRampToValueAtTime(1300, now + 0.18);
        osc2.frequency.exponentialRampToValueAtTime(1100, now + 0.28);

        gain2.gain.setValueAtTime(0.01, now);
        gain2.gain.setValueAtTime(0.4, now + 0.09);
        gain2.gain.exponentialRampToValueAtTime(0.01, now + 0.3);

        osc2.connect(gain2);
        gain2.connect(audioCtx.destination);
        osc2.start(now + 0.09);
        osc2.stop(now + 0.3);
      } catch (e) {}
    }

    function playGameOverSFX() {
      if (!audioCtx) return;
      try {
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(220, now);
        osc.frequency.exponentialRampToValueAtTime(40, now + 0.3);

        gain.gain.setValueAtTime(0.25, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);

        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.3);
      } catch (e) {}
    }

    function renderPixelMatrix(ctx, matrix, x, y, size) {
      const pSize = size / 16;
      for (let r = 0; r < 16; r++) {
        for (let c = 0; c < 16; c++) {
          const char = matrix[r][c];
          if (char !== '.') {
            ctx.fillStyle = PALETTE[char] || char;
            ctx.fillRect(
              Math.floor(x + c * pSize), 
              Math.floor(y + r * pSize), 
              Math.ceil(pSize), 
              Math.ceil(pSize)
            );
          }
        }
      }

    const DIAMOND_POWERUP = {
      yellow: {

          ".......BB.......",

      },
      pink: {

        color: '#FF80AB',
        matrix: [

      },
      purple: {

        desc: "Ghost Body",
        color: '#CE93D8',
        matrix: [

          "......MWWM......",

        ]
      }
    };

    let gameInterval = null;
    let score = 0;
    let highScore = 0;

    let selectedCharacter = 'chiikawa';
    let snake = [];
    let direction = 'RIGHT';
    let nextDirection = 'RIGHT';

    let food = { x: 5, y: 5, type: 'cake' };
    let activePowerup = null;
    let powerupItem = null;

    let touchStartX = 0;
    let touchStartY = 0;
    let toastTimeout = null;

    function highlightCharacter(charType) {
      initAudio();
      selectedCharacter = charType;

      document.querySelectorAll('.char-card').forEach(card => card.classList.remove('selected'));
      if (charType === 'chiikawa') document.getElementById('cardChiikawa').classList.add('selected');
      if (charType === 'hachiware') document.getElementById('cardHachiware').classList.add('selected');
      if (charType === 'usagi') document.getElementById('cardUsagi').classList.add('selected');
    }

    function confirmAndStartGame() {
      initAudio();
      document.getElementById('selectOverlay').classList.add('hidden');
      startGame();
    }

    function goToPlayerSelect() {
      document.getElementById('gameOverOverlay').classList.add('hidden');
      document.getElementById('selectOverlay').classList.remove('hidden');
    }

    function triggerPowerupToast(title, desc) {
      const toast = document.getElementById('powerupToast');
      document.getElementById('toastTitle').innerText = title;
      document.getElementById('toastDesc').innerText = desc;

      toast.classList.add('show');
      if (toastTimeout) clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        toast.classList.remove('show');
      }, 2200);
    }

    function startGame() {
      score = 0;
      direction = 'RIGHT';
      nextDirection = 'RIGHT';
      activePowerup = null;
      powerupItem = null;
      document.getElementById('scoreDisplay').innerText = score;
      document.getElementById('gameOverOverlay').classList.add('hidden');

      snake = [
        { x: 6, y: 8 },
        { x: 5, y: 8 },
        { x: 4, y: 8 }
      ];

      spawnFood();

      if (gameInterval) clearInterval(gameInterval);
      setGameIntervalSpeed();
    }

    function setGameIntervalSpeed() {
      if (gameInterval) clearInterval(gameInterval);
      let speed = 130;
      if (activePowerup && activePowerup.type === 'blue') {
        speed = 240; // Slow Motion Speed
      }
      gameInterval = setInterval(gameLoop, speed);
    }

    function restartGame() {
      initAudio();
      startGame();
    }

    function spawnFood() {
      const types = ['cake', 'pudding', 'dango', 'ramen', 'onigiri'];
      const randomType = types[Math.floor(Math.random() * types.length)];
      
      let newX, newY, collision;
      do {
        collision = false;
        newX = Math.floor(Math.random() * GRID_SIZE);
        newY = Math.floor(Math.random() * GRID_SIZE);
        for (let seg of snake) {
          if (seg.x === newX && seg.y === newY) collision = true;
        }
      } while (collision);

      food = { x: newX, y: newY, type: randomType };

      // Chance to spawn diamond powerup
      if (!powerupItem && Math.random() < 0.28) {
        spawnPowerup();
      }
    }

    function spawnPowerup() {
      const keys = ['yellow', 'blue', 'pink', 'purple'];
      const randomKey = keys[Math.floor(Math.random() * keys.length)];
      let px, py, collision;
      do {
        collision = false;
        px = Math.floor(Math.random() * GRID_SIZE);
        py = Math.floor(Math.random() * GRID_SIZE);
        if (food.x === px && food.y === py) collision = true;
        for (let seg of snake) {
          if (seg.x === px && seg.y === py) collision = true;
        }
      } while (collision);

      powerupItem = { x: px, y: py, type: randomKey };
    }

    function gameLoop() {
      direction = nextDirection;

      const head = { x: snake[0].x, y: snake[0].y };
      if (direction === 'UP') head.y--;
      if (direction === 'DOWN') head.y++;
      if (direction === 'LEFT') head.x--;
      if (direction === 'RIGHT') head.x++;

      const isGhost = activePowerup && activePowerup.type === 'purple';

      if (!isGhost) {
        if (head.x < 0 || head.x >= GRID_SIZE || head.y < 0 || head.y >= GRID_SIZE) {
          gameOver();
          return;
        }
      } else {
        // Wrap around walls for Ghost Body
        if (head.x < 0) head.x = GRID_SIZE - 1;
        if (head.x >= GRID_SIZE) head.x = 0;
        if (head.y < 0) head.y = GRID_SIZE - 1;
        if (head.y >= GRID_SIZE) head.y = 0;
      }

      // Check self-collision
      if (!isGhost) {
        for (let i = 0; i < snake.length; i++) {
          if (snake[i].x === head.x && snake[i].y === head.y) {
            gameOver();
            return;
          }
        }
      }

      snake.unshift(head);

      // Check food consumption
      if (head.x === food.x && head.y === food.y) {
        playChompSFX();
        let pts = 10;
        if (activePowerup && activePowerup.type === 'yellow') pts *= 2;
        score += pts;
        if (score > highScore) {
          highScore = score;
          document.getElementById('highScoreDisplay').innerText = highScore;
        }
        document.getElementById('scoreDisplay').innerText = score;
        spawnFood();
      } else {
        snake.pop();
      }

      // Check powerup consumption
      if (powerupItem && head.x === powerupItem.x && head.y === powerupItem.y) {
        playYippeeSFX();
        const info = DIAMOND_POWERUP[powerupItem.type];
        triggerPowerupToast(info.title, info.desc);

        if (powerupItem.type === 'pink') {
          if (snake.length > 2) snake.pop();
          if (snake.length > 2) snake.pop();
        } else {
          activePowerup = { type: powerupItem.type, timer: 75 };
          setGameIntervalSpeed();
        }
        powerupItem = null;
      }

      // Handle powerup timer decay
      if (activePowerup) {
        activePowerup.timer--;
        if (activePowerup.timer <= 0) {
          activePowerup = null;
          setGameIntervalSpeed();
        }
      }

      render();
    }

    function render() {
      const tileSize = CANVAS.width / GRID_SIZE;
      CTX.clearRect(0, 0, CANVAS.width, CANVAS.height);

      for (let r = 0; r < GRID_SIZE; r++) {
        for (let c = 0; c < GRID_SIZE; c++) {
          if ((r + c) % 2 === 0) {
            CTX.fillStyle = '#fefae0';
            CTX.fillRect(c * tileSize, r * tileSize, tileSize, tileSize);
          }
        }
      }

      renderPixelMatrix(CTX, FOOD_ITEMS[food.type], food.x * tileSize, food.y * tileSize, tileSize);

      if (powerupItem) {
        renderPixelMatrix(CTX, DIAMOND_POWERUP[powerupItem.type].matrix, powerupItem.x * tileSize, powerupItem.y * tileSize, tileSize);
      }

      let baseMatrix = CHIIKAWA_BASE;
      if (selectedCharacter === 'hachiware') baseMatrix = HACHIWARE_BASE;
      if (selectedCharacter === 'usagi') baseMatrix = USAGI_BASE;

      for (let i = snake.length - 1; i >= 0; i--) {
        const seg = snake[i];
        const sx = seg.x * tileSize;
        const sy = seg.y * tileSize;

        if (activePowerup && activePowerup.type === 'purple') {
          CTX.globalAlpha = 0.6;
        } else {
          CTX.globalAlpha = 1.0;
        }

        renderPixelMatrix(CTX, baseMatrix, sx, sy, tileSize);

        // Apply global accessory roster cyclically
        const accessoryKey = GLOBAL_ROSTER[i % GLOBAL_ROSTER.length];
        if (accessoryKey && ACCESSORIES[accessoryKey]) {
          renderPixelMatrix(CTX, ACCESSORIES[accessoryKey], sx, sy, tileSize);
        }

        CTX.globalAlpha = 1.0;
      }

      updatePowerupHUD();
    }

    function updatePowerupHUD() {
      const container = document.getElementById('powerupBar');
      container.innerHTML = '';
      if (activePowerup) {
        const info = DIAMOND_POWERUP[activePowerup.type];
        const badge = document.createElement('div');
        badge.className = 'powerup-badge';
        badge.style.borderColor = info.color;
        badge.innerHTML = `<span style="color:${info.color};">♦ ${info.title}</span> (${Math.ceil(activePowerup.timer / 8)}s)`;
        container.appendChild(badge);
      }
    }

    function gameOver() {
      playGameOverSFX();
      clearInterval(gameInterval);
      document.getElementById('finalScore').innerText = score;
      document.getElementById('gameOverOverlay').classList.remove('hidden');
    }

    function setDirection(newDir) {
      if (newDir === 'UP' && direction !== 'DOWN') nextDirection = 'UP';
      if (newDir === 'DOWN' && direction !== 'UP') nextDirection = 'DOWN';
      if (newDir === 'LEFT' && direction !== 'RIGHT') nextDirection = 'LEFT';
      if (newDir === 'RIGHT' && direction !== 'LEFT') nextDirection = 'RIGHT';
    }

    window.addEventListener('keydown', (e) => {
      initAudio();
      if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'w', 'W', 'a', 'A', 's', 'S', 'd', 'D'].includes(e.key)) {
        e.preventDefault();
      }
      if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') setDirection('UP');
      if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') setDirection('DOWN');
      if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') setDirection('LEFT');
      if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') setDirection('RIGHT');
    }, { passive: false });

    CANVAS.addEventListener('touchstart', (e) => {
      initAudio();
      const touch = e.touches[0];
      touchStartX = touch.clientX;
      touchStartY = touch.clientY;
    }, { passive: true });

    CANVAS.addEventListener('touchmove', (e) => {
      e.preventDefault();
    }, { passive: false });

    CANVAS.addEventListener('touchend', (e) => {
      if (!touchStartX || !touchStartY) return;
      const touch = e.changedTouches[0];
      const diffX = touch.clientX - touchStartX;
      const diffY = touch.clientY - touchStartY;

      if (Math.abs(diffX) > 15 || Math.abs(diffY) > 15) {
        if (Math.abs(diffX) > Math.abs(diffY)) {
          if (diffX > 0) setDirection('RIGHT');
          else setDirection('LEFT');
        } else {
          if (diffY > 0) setDirection('DOWN');
          else setDirection('UP');
        }
      }
      touchStartX = 0;
      touchStartY = 0;
    }, { passive: true });

    function toggleDPad() {
      const dpad = document.getElementById('dpad');
      dpad.classList.toggle('hidden');
    }
