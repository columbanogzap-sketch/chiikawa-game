<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>CHIIKAWA SNAKE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #fbebf2;
      --card-bg: #ffffff;
      --border-color: #4a332a;
      --accent-pink: #ff8fb1;
      --accent-yellow: #ffe57f;
      --accent-blue: #90caf9;
      --accent-purple: #ce93d8;
      --font-pixel: 'Press Start 2P', cursive, monospace;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      background-image: 
        radial-gradient(#ffcdd2 15%, transparent 16%),
        radial-gradient(#ffcdd2 15%, transparent 16%);
      background-size: 30px 30px;
      background-position: 0 0, 15px 15px;
      font-family: var(--font-pixel);
      color: var(--border-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      padding: 15px 10px 40px 10px;
      overflow-y: auto;
      overflow-x: hidden;
      touch-action: manipulation;
    }

    .game-wrapper {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    header {
      text-align: center;
      width: 100%;
    }

    h1 {
      font-size: 16px;
      color: #ff5252;
      text-shadow: 2px 2px 0 #ffffff, 3px 3px 0 var(--border-color);
      letter-spacing: 1px;
      margin-bottom: 2px;
      line-height: 1.3;
    }

    .arcade-box {
      width: 100%;
      background: var(--card-bg);
      border: 4px solid var(--border-color);
      border-radius: 12px;
      box-shadow: 0 8px 0 var(--border-color);
      padding: 10px;
      position: relative;
    }

    .hud {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #fff8e1;
      border: 3px solid var(--border-color);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 8px;
      margin-bottom: 8px;
    }

    .hud-val {
      color: #e65100;
      margin-left: 4px;
    }

    .canvas-container {
      position: relative;
      width: 100%;
      padding-top: 100%;
      background-color: #fffde7;
      border: 4px solid var(--border-color);
      border-radius: 8px;
      overflow: hidden;
      box-sizing: border-box;
    }

    #gameCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      touch-action: none;
    }

    .powerup-toast {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%) translateY(-20px);
      background: #fff176;
      border: 3px solid var(--border-color);
      border-radius: 8px;
      padding: 6px 10px;
      text-align: center;
      box-shadow: 0 4px 0 var(--border-color);
      z-index: 20;
      opacity: 0;
      transition: all 0.25s ease-out;
      pointer-events: none;
      width: 85%;
    }

    .powerup-toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .toast-title {
      font-size: 8px;
      color: #d81b60;
      margin-bottom: 3px;
    }

    .toast-desc {
      font-size: 6px;
      color: #333;
      line-height: 1.3;
    }

    .powerup-bar {
      width: 100%;
      height: 34px;
      margin-top: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .powerup-timer-box {
      width: 100%;
      height: 34px;
      background: #ffffff;
      border: 3px solid var(--border-color);
      border-radius: 8px;
      padding: 0 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 3px 0 var(--border-color);
      box-sizing: border-box;
    }

    .powerup-timer-title {
      font-size: 7px;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .powerup-timer-bar-bg {
      width: 110px;
      height: 10px;
      background: #f0e6df;
      border: 2px solid var(--border-color);
      border-radius: 5px;
      overflow: hidden;
      position: relative;
    }

    .powerup-timer-bar-fill {
      height: 100%;
      width: 100%;
      transition: width 0.12s linear;
    }

    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(255, 253, 231, 0.98);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 8px;
      text-align: center;
      z-index: 10;
      overflow-y: auto;
    }

    .overlay.hidden {
      display: none;
    }

    #selectOverlay {
      background-color: transparent;
      pointer-events: none;
    }

    #selectOverlay > * {
      pointer-events: auto;
    }

    #gameOverOverlay {
      justify-content: center;
      gap: 12px;
      padding: 20px;
    }

    .overlay-title {
      font-size: 11px;
      color: #ff4081;
      text-shadow: 1px 1px 0 #fff, 2px 2px 0 var(--border-color);
      margin-bottom: 4px;
      line-height: 1.2;
    }

    #gameOverOverlay .overlay-title {
      font-size: 14px;
      margin-bottom: 4px;
    }

    .char-select-grid {
      display: flex;
      flex-direction: column;
      gap: 4px;
      width: 100%;
      max-width: 280px;
      margin-bottom: 6px;
    }

    .char-card {
      background: #ffffff;
      border: 3px solid var(--border-color);
      border-radius: 8px;
      padding: 5px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 3px 0 var(--border-color);
      transition: all 0.15s ease;
    }

    .char-card.selected {
      border-color: #ff4081;
      box-shadow: 0 3px 0 #ff4081;
      transform: scale(1.02);
    }

    .char-card.chiikawa { background-color: #fff0f5; }
    .char-card.hachiware { background-color: #e3f2fd; }
    .char-card.usagi { background-color: #fffde7; }

    .char-name {
      font-size: 9px;
      font-weight: bold;
      letter-spacing: 1px;
      text-align: center;
      width: 100%;
    }

    .treats-container {
      width: 100%;
      max-width: 290px;
      margin-bottom: 8px;
      background: #fff8e1;
      border: 2px solid var(--border-color);
      border-radius: 8px;
      padding: 8px;
      height: 145px;
      max-height: 145px;
      box-sizing: border-box;
      overflow-y: auto;
    }

    .treats-container::-webkit-scrollbar {
      width: 4px;
    }
    .treats-container::-webkit-scrollbar-track {
      background: #f1e4c3;
      border-radius: 4px;
    }
    .treats-container::-webkit-scrollbar-thumb {
      background: var(--border-color);
      border-radius: 4px;
    }

    .treats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px 4px;
      width: 100%;
    }

    .treat-grid-item {
      background: transparent;
      border: none;
      padding: 2px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      box-shadow: none;
    }

    .treat-grid-item canvas {
      position: static;
      width: 32px;
      height: 32px;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      margin-bottom: 3px;
      flex-shrink: 0;
    }

    .treat-grid-label {
      font-size: 5px;
      text-align: center;
      color: var(--border-color);
      line-height: 1.2;
      word-break: break-word;
    }

    .btn-pixel {
      font-family: var(--font-pixel);
      font-size: 9px;
      padding: 8px 12px;
      border: 3px solid var(--border-color);
      border-radius: 8px;
      background: var(--accent-yellow);
      color: var(--border-color);
      cursor: pointer;
      box-shadow: 0 4px 0 var(--border-color);
      width: 90%;
      max-width: 260px;
    }

    .btn-pixel:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 var(--border-color);
    }

    .btn-pixel.secondary {
      background: var(--accent-blue);
      margin-top: 0;
    }

    .controls-panel {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      margin-top: 10px;
    }

    .btn-toggle-dpad {
      font-family: var(--font-pixel);
      font-size: 7px;
      background: #fff;
      border: 2px solid var(--border-color);
      border-radius: 4px;
      padding: 5px 8px;
      cursor: pointer;
      box-shadow: 2px 2px 0 var(--border-color);
    }

    .dpad-container {
      display: grid;
      grid-template-columns: 44px 44px 44px;
      grid-template-rows: 44px 44px 44px;
      gap: 0;
      background: #ffb6c1;
      padding: 10px;
      border: 4px solid var(--border-color);
      box-shadow: 0 6px 0 var(--border-color);
      position: relative;
      image-rendering: pixelated;
    }

    .dpad-container.hidden {
      display: none;
    }

    .dpad-btn {
      background: #ffdbed;
      border: 4px solid var(--border-color);
      cursor: pointer;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: inset -3px -3px 0 #ffa6c9, inset 3px 3px 0 #ffffff;
    }

    .dpad-btn::after {
      content: '';
      width: 8px;
      height: 8px;
      background: #ff6b9d;
      border: 2px solid var(--border-color);
    }

    .dpad-btn:active {
      background: #ff6b9d;
      box-shadow: inset 3px 3px 0 #d81b60;
    }

    .dpad-btn:active::after {
      background: #fff;
    }

    .dpad-up { grid-column: 2; grid-row: 1; border-bottom: none; }
    .dpad-left { grid-column: 1; grid-row: 2; border-right: none; }
    .dpad-center { 
      grid-column: 2; 
      grid-row: 2; 
      background: #ffdbed;
      border: 4px solid var(--border-color);
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: inset -3px -3px 0 #ffa6c9, inset 3px 3px 0 #ffffff;
    }
    .dpad-center::before {
      content: '♥';
      font-size: 12px;
      color: #ff6b9d;
    }
    .dpad-right { grid-column: 3; grid-row: 2; border-left: none; }
    .dpad-down { grid-column: 2; grid-row: 3; border-top: none; }

    .controls-hint {
      font-size: 6px;
      color: #666;
      text-align: center;
      line-height: 1.3;
    }
  </style>
</head>
<body>

  <div class="game-wrapper">
    <header>
      <h1>CHIIKAWA SNAKE</h1>
    </header>

    <div class="arcade-box">
      <div class="hud">
        <div>SCORE:<span id="scoreDisplay" class="hud-val">0</span></div>
        <div>HIGH SCORE:<span id="highScoreDisplay" class="hud-val">0</span></div>
      </div>

      <div class="canvas-container">
        <canvas id="gameCanvas" width="320" height="320"></canvas>

        <div id="powerupToast" class="powerup-toast">
          <div id="toastTitle" class="toast-title">POWER-UP!</div>
          <div id="toastDesc" class="toast-desc">Power-up activated!</div>
        </div>

        <div id="selectOverlay" class="overlay">
          <div class="overlay-title">SELECT YOUR PAL</div>

          <div class="char-select-grid">
            <div id="cardChiikawa" class="char-card chiikawa selected" onclick="highlightCharacter('chiikawa')">
              <div class="char-name" style="color:#d81b60;">CHIIKAWA</div>
            </div>

            <div id="cardHachiware" class="char-card hachiware" onclick="highlightCharacter('hachiware')">
              <div class="char-name" style="color:#1e88e5;">HACHIWARE</div>
            </div>

            <div id="cardUsagi" class="char-card usagi" onclick="highlightCharacter('usagi')">
              <div class="char-name" style="color:#f57f17;">USAGI</div>
            </div>
          </div>

          <div class="treats-container">
            <div id="treatsGrid" class="treats-grid"></div>
          </div>

          <button class="btn-pixel" onclick="confirmAndStartGame()">START GAME</button>
        </div>

        <div id="gameOverOverlay" class="overlay hidden">
          <div class="overlay-title" style="color:#d32f2f;">GAME OVER!</div>
          <div style="font-size: 9px; margin-bottom: 8px;">FINAL SCORE: <span id="finalScore" style="color:#e65100;">0</span></div>
          <button class="btn-pixel" onclick="restartGame()">PLAY AGAIN</button>
          <button class="btn-pixel secondary" onclick="goToPlayerSelect()">CHANGE PAL</button>
        </div>
      </div>

      <div id="powerupBar" class="powerup-bar"></div>
    </div>

    <div class="controls-panel">
      <button class="btn-toggle-dpad" onclick="toggleDPad()">TOGGLE CONSOLE D-PAD</button>
      
      <div id="dpad" class="dpad-container hidden">
        <div class="dpad-btn dpad-up" onclick="setDirection('UP')"></div>
        <div class="dpad-btn dpad-left" onclick="setDirection('LEFT')"></div>
        <div class="dpad-center"></div>
        <div class="dpad-btn dpad-right" onclick="setDirection('RIGHT')"></div>
        <div class="dpad-btn dpad-down" onclick="setDirection('DOWN')"></div>
      </div>

      <div class="controls-hint">
        SWIPE ON CANVAS OR USE ARROW/WASD KEYS
      </div>
    </div>
  </div>

  <script>
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new AudioCtx();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playChompSFX() {
      if (!audioCtx) return;
      try {
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(320, now);
        osc.frequency.exponentialRampToValueAtTime(90, now + 0.08);
        
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);

        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.08);
      } catch (e) {}
    }

    function playYippeeSFX() {
      if (!audioCtx) return;
      try {
        const now = audioCtx.currentTime;
        const osc1 = audioCtx.createOscillator();
        const gain1 = audioCtx.createGain();
        osc1.type = 'triangle';
        osc1.frequency.setValueAtTime(450, now);
        osc1.frequency.exponentialRampToValueAtTime(850, now + 0.07);

        gain1.gain.setValueAtTime(0.35, now);
        gain1.gain.exponentialRampToValueAtTime(0.01, now + 0.08);

        osc1.connect(gain1);
        gain1.connect(audioCtx.destination);
        osc1.start(now);
        osc1.stop(now + 0.08);

        const osc2 = audioCtx.createOscillator();
        const gain2 = audioCtx.createGain();
        osc2.type = 'sine';
        osc2.frequency.setValueAtTime(950, now + 0.09);
        osc2.frequency.linearRampToValueAtTime(1300, now + 0.18);
        osc2.frequency.exponentialRampToValueAtTime(1100, now + 0.28);

        gain2.gain.setValueAtTime(0.01, now);
        gain2.gain.setValueAtTime(0.4, now + 0.09);
        gain2.gain.exponentialRampToValueAtTime(0.01, now + 0.3);

        osc2.connect(gain2);
        gain2.connect(audioCtx.destination);
        osc2.start(now + 0.09);
        osc2.stop(now + 0.3);
      } catch (e) {}
    }

    function playGameOverSFX() {
      if (!audioCtx) return;
      try {
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(220, now);
        osc.frequency.exponentialRampToValueAtTime(40, now + 0.3);

        gain.gain.setValueAtTime(0.25, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);

        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.3);
      } catch (e) {}
    }

    function renderPixelMatrix(ctx, matrix, x, y, size) {
      if (!matrix) return;
      const pSize = size / 16;
      for (let r = 0; r < 16; r++) {
        for (let c = 0; c < 16; c++) {
          const char = matrix[r][c];
          if (char !== '.') {
            ctx.fillStyle = PALETTE[char] || char;
            ctx.fillRect(
              Math.floor(x + c * pSize), 
              Math.floor(y + r * pSize), 
              Math.ceil(pSize), 
              Math.ceil(pSize)
            );
          }
        }
      }
    }

    function generateRandomMenuOutfits(count) {
      menuRandomOutfits = [];
      for (let i = 0; i < count; i++) {
        const randHat = (Math.random() < 0.7) ? HATS_KEYS[Math.floor(Math.random() * HATS_KEYS.length)] : null;
        const randShirt = (Math.random() < 0.7) ? CLOTHES_KEYS[Math.floor(Math.random() * CLOTHES_KEYS.length)] : null;
        menuRandomOutfits.push({ hat: randHat, shirt: randShirt });
      }
    }

    function renderStartScreenCanvas() {
      if (gameState !== 'START') return;

      const tileSize = CANVAS.width / GRID_SIZE;
      CTX.clearRect(0, 0, CANVAS.width, CANVAS.height);

      for (let r = 0; r < GRID_SIZE; r++) {
        for (let c = 0; c < GRID_SIZE; c++) {
          if ((r + c) % 2 === 0) {
            CTX.fillStyle = '#fefae0';
            CTX.fillRect(c * tileSize, r * tileSize, tileSize, tileSize);
          }
        }
      }

      const LOOP_SPAN = GRID_SIZE + 12;
      menuSnakeProgress = (menuSnakeProgress + 0.05) % LOOP_SPAN;

      const characters = [CHIIKAWA_BASE, HACHIWARE_BASE, USAGI_BASE];
      const totalSegs = 12;

      if (menuRandomOutfits.length === 0) {
        generateRandomMenuOutfits(totalSegs);
      }

      for (let i = totalSegs - 1; i >= 0; i--) {
        const charMatrix = characters[i % characters.length];
        
        let gridX = menuSnakeProgress - i;
        if (gridX < -3) gridX += LOOP_SPAN;

        const gridY = 13 + Math.sin(gridX * 0.5) * 0.8;

        const sx = gridX * tileSize;
        const sy = gridY * tileSize;

        renderPixelMatrix(CTX, charMatrix, sx, sy, tileSize);

        const outfit = menuRandomOutfits[i] || {};
        if (outfit.shirt && ACCESSORIES[outfit.shirt]) {
          renderPixelMatrix(CTX, ACCESSORIES[outfit.shirt], sx, sy, tileSize);
        }
        if (outfit.hat && ACCESSORIES[outfit.hat]) {
          const isHatItem = ['angel_halo','beret','party_hat','royal_tiara','pirate_hat','wizard_hat','viking_helmet'].includes(outfit.hat);
          const isUsagi = (charMatrix === USAGI_BASE);
          const offsetY = (isHatItem && isUsagi) ? 2 * (tileSize / 16) : 0;
          renderPixelMatrix(CTX, ACCESSORIES[outfit.hat], sx, sy + offsetY, tileSize);
        }
      }

      animFrameId = requestAnimationFrame(renderStartScreenCanvas);
    }

    function renderTreatsGrid() {
      const gridContainer = document.getElementById('treatsGrid');
      gridContainer.innerHTML = '';

      Object.keys(FOOD_ITEMS).forEach(key => {
        const itemDiv = document.createElement('div');
        itemDiv.className = 'treat-grid-item';

        const cvs = document.createElement('canvas');
        cvs.width = 32;
        cvs.height = 32;
        const ctx = cvs.getContext('2d');
        ctx.imageSmoothingEnabled = false;
        renderPixelMatrix(ctx, FOOD_ITEMS[key], 0, 0, 32);

        const label = document.createElement('div');
        label.className = 'treat-grid-label';
        label.innerText = DISPLAY_LABELS[key] || key.toUpperCase();

        itemDiv.appendChild(cvs);
        itemDiv.appendChild(label);
        gridContainer.appendChild(itemDiv);
      });
    }

      document.querySelectorAll('.char-card').forEach(card => card.classList.remove('selected'));

      if (charType === 'hachiware') document.getElementById('cardHachiware').classList.add('selected');
      if (charType === 'usagi') document.getElementById('cardUsagi').classList.add('selected');

    function triggerPowerupToast(title, desc) {

      document.getElementById('toastTitle').innerText = title;

      toast.classList.add('show');
      if (toastTimeout) clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {

      }, 2200);
    }

    function startGame() {
      gameState = 'PLAYING';
      if (animFrameId) cancelAnimationFrame(animFrameId);
      
      score = 0;
      direction = 'RIGHT';
      nextDirection = 'RIGHT';
      activePowerup = null;
      powerupItem = null;
      document.getElementById('scoreDisplay').innerText = score;
      document.getElementById('gameOverOverlay').classList.add('hidden');

      snake = [
        { x: 6, y: 8 },

        { x: 4, y: 8 }
      ];

      spawnFood();

      if (gameInterval) clearInterval(gameInterval);
      setGameIntervalSpeed();
    }

    function setGameIntervalSpeed() {
      if (gameInterval) clearInterval(gameInterval);
      let speed = 130;
      if (activePowerup && activePowerup.type === 'blue') {
        speed = 240; 
      }
      gameInterval = setInterval(gameLoop, speed);
    }

    function restartGame() {
      initAudio();
      startGame();
    }

    function spawnFood() {
      const types = Object.keys(FOOD_ITEMS);
      const randomType = types[Math.floor(Math.random() * types.length)];
      
      let newX, newY, collision;
      do {
        collision = false;
        newX = Math.floor(Math.random() * GRID_SIZE);
        newY = Math.floor(Math.random() * GRID_SIZE);
        for (let seg of snake) {
          if (seg.x === newX && seg.y === newY) collision = true;
        }
      } while (collision);

      food = { x: newX, y: newY, type: randomType };

      if (!powerupItem && Math.random() < 0.28) {
        spawnPowerup();
      }
    }

    function spawnPowerup() {
      const keys = ['yellow', 'blue', 'pink', 'purple'];
      const randomKey = keys[Math.floor(Math.random() * keys.length)];
      let px, py, collision;
      do {
        collision = false;
        px = Math.floor(Math.random() * GRID_SIZE);
        py = Math.floor(Math.random() * GRID_SIZE);
        if (food.x === px && food.y === py) collision = true;
        for (let seg of snake) {
          if (seg.x === px && seg.y === py) collision = true;
        }
      } while (collision);

      powerupItem = { x: px, y: py, type: randomKey };
    }

    function gameLoop() {
      if (gameState !== 'PLAYING') return;

      direction = nextDirection;

      const head = { x: snake[0].x, y: snake[0].y };
      if (direction === 'UP') head.y--;
      if (direction === 'DOWN') head.y++;
      if (direction === 'LEFT') head.x--;
      if (direction === 'RIGHT') head.x++;

      const isGhost = activePowerup && activePowerup.type === 'purple';

      if (!isGhost) {
        if (head.x < 0 || head.x >= GRID_SIZE || head.y < 0 || head.y >= GRID_SIZE) {
          gameOver();
          return;
        }
      } else {
        if (head.x < 0) head.x = GRID_SIZE - 1;
        if (head.x >= GRID_SIZE) head.x = 0;
        if (head.y < 0) head.y = GRID_SIZE - 1;
        if (head.y >= GRID_SIZE) head.y = 0;
      }

      if (!isGhost) {
        for (let i = 0; i < snake.length; i++) {
          if (snake[i].x === head.x && snake[i].y === head.y) {
            gameOver();
            return;
          }
        }
      }

      snake.unshift(head);

      if (head.x === food.x && head.y === food.y) {
        playChompSFX();
        let pts = 10;
        if (activePowerup && activePowerup.type === 'yellow') pts *= 2;
        score += pts;
        if (score > highScore) {
          highScore = score;
          document.getElementById('highScoreDisplay').innerText = highScore;
        }
        document.getElementById('scoreDisplay').innerText = score;
        spawnFood();
      } else {
        snake.pop();
      }

      if (powerupItem && head.x === powerupItem.x && head.y === powerupItem.y) {
        playYippeeSFX();
        const info = GEM_POWERUP[powerupItem.type];
        triggerPowerupToast(info.title, info.desc);

        if (powerupItem.type === 'pink') {
          let shrinkCount = Math.min(4, snake.length - 2); 
          for (let s = 0; s < shrinkCount; s++) {
            snake.pop();
          }
        }
        
        activePowerup = { type: powerupItem.type, timer: 75, maxTimer: 75 };
        setGameIntervalSpeed();
        powerupItem = null;
      }

      if (activePowerup) {
        activePowerup.timer--;
        if (activePowerup.timer <= 0) {
          activePowerup = null;
          setGameIntervalSpeed();
        }
      }

      render();
    }

    function render() {
      const tileSize = CANVAS.width / GRID_SIZE;
      CTX.clearRect(0, 0, CANVAS.width, CANVAS.height);

      for (let r = 0; r < GRID_SIZE; r++) {
        for (let c = 0; c < GRID_SIZE; c++) {
          if ((r + c) % 2 === 0) {
            CTX.fillStyle = '#fefae0';
            CTX.fillRect(c * tileSize, r * tileSize, tileSize, tileSize);
          }
        }
      }

      renderPixelMatrix(CTX, FOOD_ITEMS[food.type], food.x * tileSize, food.y * tileSize, tileSize);

      if (powerupItem) {
        renderPixelMatrix(CTX, GEM_POWERUP[powerupItem.type].matrix, powerupItem.x * tileSize, powerupItem.y * tileSize, tileSize);
      }

      let baseMatrix = CHIIKAWA_BASE;
      if (selectedCharacter === 'hachiware') baseMatrix = HACHIWARE_BASE;
      if (selectedCharacter === 'usagi') baseMatrix = USAGI_BASE;

      for (let i = snake.length - 1; i >= 0; i--) {
        const seg = snake[i];
        const sx = seg.x * tileSize;
        const sy = seg.y * tileSize;

        if (activePowerup && activePowerup.type === 'purple') {
          CTX.globalAlpha = 0.6;
        } else {
          CTX.globalAlpha = 1.0;
        }

        renderPixelMatrix(CTX, baseMatrix, sx, sy, tileSize);

        const outfit = menuRandomOutfits[i % menuRandomOutfits.length] || {};
        if (outfit.shirt && ACCESSORIES[outfit.shirt]) {
          renderPixelMatrix(CTX, ACCESSORIES[outfit.shirt], sx, sy, tileSize);
        }
        if (outfit.hat && ACCESSORIES[outfit.hat]) {
          const isHatItem = ['angel_halo','beret','party_hat','royal_tiara','pirate_hat','wizard_hat','viking_helmet'].includes(outfit.hat);
          const isUsagi = (selectedCharacter === 'usagi');
          const offsetY = (isHatItem && isUsagi) ? 2 * (tileSize / 16) : 0;
          renderPixelMatrix(CTX, ACCESSORIES[outfit.hat], sx, sy + offsetY, tileSize);
        }

        CTX.globalAlpha = 1.0;
      }

      updatePowerupHUD();
    }

    function updatePowerupHUD() {
      const container = document.getElementById('powerupBar');
      if (!activePowerup) {
        container.innerHTML = `
          <div class="powerup-timer-box" style="opacity: 0.5;">
            <div class="powerup-timer-title" style="color: #888;">NO POWER-UP ACTIVE</div>
            <div class="powerup-timer-bar-bg">
              <div class="powerup-timer-bar-fill" style="width: 0%; background: #ccc;"></div>
            </div>
          </div>
        `;
        return;
      }

      const info = GEM_POWERUP[activePowerup.type];
      const secondsLeft = Math.ceil(activePowerup.timer / 8);
      const maxT = activePowerup.maxTimer || 75;
      const pct = Math.max(0, Math.min(100, (activePowerup.timer / maxT) * 100));

      container.innerHTML = `
        <div class="powerup-timer-box" style="border-color: var(--border-color);">
          <div class="powerup-timer-title" style="color: ${info.color};">
            <span>♥ ${info.title}</span>
            <span style="color: var(--border-color); margin-left: 4px;">(${secondsLeft}s)</span>
          </div>
          <div class="powerup-timer-bar-bg">
            <div class="powerup-timer-bar-fill" style="width: ${pct}%; background-color: ${info.color};"></div>
          </div>
        </div>
      `;
    }

    function gameOver() {
      gameState = 'GAMEOVER';
      playGameOverSFX();
      clearInterval(gameInterval);
      document.getElementById('finalScore').innerText = score;
      document.getElementById('gameOverOverlay').classList.remove('hidden');
    }

    function setDirection(newDir) {
      if (newDir === 'UP' && direction !== 'DOWN') nextDirection = 'UP';
      if (newDir === 'DOWN' && direction !== 'UP') nextDirection = 'DOWN';
      if (newDir === 'LEFT' && direction !== 'RIGHT') nextDirection = 'LEFT';
      if (newDir === 'RIGHT' && direction !== 'LEFT') nextDirection = 'RIGHT';
    }

    window.addEventListener('keydown', (e) => {
      initAudio();
      if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'w', 'W', 'a', 'A', 's', 'S', 'd', 'D'].includes(e.key)) {
        e.preventDefault();
      }
      if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') setDirection('UP');
      if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') setDirection('DOWN');
      if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') setDirection('LEFT');
      if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') setDirection('RIGHT');
    }, { passive: false });

    CANVAS.addEventListener('touchstart', (e) => {
      initAudio();
      const touch = e.touches[0];
      touchStartX = touch.clientX;
      touchStartY = touch.clientY;
    }, { passive: true });

    CANVAS.addEventListener('touchmove', (e) => {
      e.preventDefault();
    }, { passive: false });

    CANVAS.addEventListener('touchend', (e) => {
      if (!touchStartX || !touchStartY) return;
      const touch = e.changedTouches[0];
      const diffX = touch.clientX - touchStartX;
      const diffY = touch.clientY - touchStartY;

      if (Math.abs(diffX) > 15 || Math.abs(diffY) > 15) {
        if (Math.abs(diffX) > Math.abs(diffY)) {
          if (diffX > 0) setDirection('RIGHT');
          else setDirection('LEFT');
        } else {
          if (diffY > 0) setDirection('DOWN');
          else setDirection('UP');
        }
      }
      touchStartX = 0;
      touchStartY = 0;
    }, { passive: true });

    function toggleDPad() {
      const dpad = document.getElementById('dpad');
      dpad.classList.toggle('hidden');
    }
    
    window.onload = () => {
      generateRandomMenuOutfits(12);
      renderTreatsGrid();
      renderStartScreenCanvas();
    };
  </script>
</body>
</html>
